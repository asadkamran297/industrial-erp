<label class="filter-chip">From {% include "components/forms/control.html" with type="date" name="date_from" value=filters.date_from cell=True attrs='onchange="this.form.submit()" aria-label="Date from"' only %}</label>
<label class="filter-chip">To {% include "components/forms/control.html" with type="date" name="date_to" value=filters.date_to cell=True attrs='onchange="this.form.submit()" aria-label="Date to"' only %}</label>
{% if show_wheat %}
<label class="filter-chip">
  Wheat
  {% component "forms/control" type="select" name="wheat_item" cell=True attrs='onchange="this.form.submit()"' only %}
    <option value="">All</option>
    {% for item in wheat_options %}<option value="{{ item.pk }}" {% if filters.wheat_item == item.pk|stringformat:'s' %}selected{% endif %}>{{ item.name }}</option>{% endfor %}
  {% endcomponent %}
</label>
{% endif %}
<label class="filter-chip">
  Godown
  {% component "forms/control" type="select" name="godown" cell=True attrs='onchange="this.form.submit()"' only %}
    <option value="">All</option>
    {% for godown in godown_options %}<option value="{{ godown.pk }}" {% if filters.godown == godown.pk|stringformat:'s' %}selected{% endif %}>{{ godown.name }}</option>{% endfor %}
  {% endcomponent %}
</label>
