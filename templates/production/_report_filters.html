{% comment %}
The one filter bar the three production reports share. Date range plus the two
dimensions a mill actually slices production by.

    {% include "production/_report_filters.html" with show_wheat=1 %}
{% endcomment %}
<form method="get" class="mb-4 rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900">
  <div class="grid gap-3 md:grid-cols-[1fr_auto]">
    <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
      <div>
        <label class="mb-1 block text-xs font-medium text-slate-500" for="date_from">Date from</label>
        <input id="date_from" type="date" name="date_from" value="{{ filters.date_from|default:'' }}" class="form-input">
      </div>
      <div>
        <label class="mb-1 block text-xs font-medium text-slate-500" for="date_to">Date to</label>
        <input id="date_to" type="date" name="date_to" value="{{ filters.date_to|default:'' }}" class="form-input">
      </div>
      {% if show_wheat %}
      <div>
        <label class="mb-1 block text-xs font-medium text-slate-500" for="wheat_item">Wheat item</label>
        <select id="wheat_item" name="wheat_item" class="form-select">
          <option value="">All wheat items</option>
          {% for item in wheat_options %}
            <option value="{{ item.pk }}" {% if filters.wheat_item == item.pk|stringformat:'s' %}selected{% endif %}>{{ item.name }}</option>
          {% endfor %}
        </select>
      </div>
      {% endif %}
      <div>
        <label class="mb-1 block text-xs font-medium text-slate-500" for="godown">Godown</label>
        <select id="godown" name="godown" class="form-select">
          <option value="">All godowns</option>
          {% for godown in godown_options %}
            <option value="{{ godown.pk }}" {% if filters.godown == godown.pk|stringformat:'s' %}selected{% endif %}>{{ godown.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="flex items-end justify-end gap-2">
      <a href="{{ request.path }}" class="toolbar-btn">Reset</a>
      <button type="submit" class="btn-primary">Apply</button>
    </div>
  </div>
</form>
