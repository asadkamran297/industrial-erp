<div class="card{% if extra %} {{ extra }}{% endif %}"{% if id %} id="{{ id }}"{% endif %}>
  {% if title or slots.actions %}<div class="card-head">{% if title %}<h2 class="card-title">{{ title }}</h2>{% endif %}{% if slots.actions %}<div class="flex flex-wrap items-center gap-2">{{ slots.actions }}</div>{% endif %}</div>{% endif %}
  <div class="card-body{% if flush %} card-body--flush{% endif %}">{{ slot }}</div>
</div>
