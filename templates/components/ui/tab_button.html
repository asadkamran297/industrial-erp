{% if data_tab %}<button type="button" class="tab tab-btn" data-tab="{{ data_tab }}" role="tab">{{ label }}</button>{% else %}{% firstof model "tab" as tab_model %}<button type="button" class="tab" role="tab" @click="{% if setter %}{{ setter }}('{{ key }}'){% else %}{{ tab_model }} = '{{ key }}'{% endif %}" :class="{ 'is-on': {{ tab_model }} === '{{ key }}' }" :aria-selected="String({{ tab_model }} === '{{ key }}')">{{ label }}</button>{% endif %}
