<form class="relative" role="search">
  <label class="sr-only" for="global-search">Search</label>
  <input id="global-search" name="q" type="search" placeholder="{{ placeholder|default:'Search...' }}" class="h-11 w-full rounded-lg border border-slate-200 bg-white px-4 pr-10 text-sm outline-none transition focus:border-[var(--primary-color)] focus:ring-4 focus:ring-blue-500/10 dark:border-slate-700 dark:bg-slate-900">
  <span class="pointer-events-none absolute right-3 top-2.5 text-slate-400">⌕</span>
</form>
