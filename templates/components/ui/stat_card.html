<div class="stat-tile">
  {% if icon %}<span class="stat-icon">{{ icon }}</span>{% endif %}
  <div class="min-w-0">
    <p class="stat-label">{{ label }}</p>
    <p class="stat-value">{{ value }}</p>
    {% if hint %}<p class="mt-0.5 text-xs text-slate-500 dark:text-slate-400">{{ hint }}</p>{% endif %}
  </div>
</div>
