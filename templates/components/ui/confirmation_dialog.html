<div class="modal-backdrop is-closed" id="confirm-dialog" data-modal role="alertdialog" aria-modal="true" aria-labelledby="confirm-dialog-title">
  <div class="modal">
    <div class="modal__body">
      <div class="modal__lead">
        <span class="modal__mark modal__mark--danger">{% icon "alert" %}</span>
        <div>
          <h2 class="modal__title" id="confirm-dialog-title">Confirm</h2>
          <p class="mt-1 text-sm" data-confirm-message></p>
        </div>
      </div>
      <div class="field" data-confirm-reason hidden>
        <label class="field__label" for="confirm-dialog-reason">Reason</label>
        <input type="text" id="confirm-dialog-reason" class="control" maxlength="255">
      </div>
    </div>
    <div class="modal__foot">
      {% include "components/ui/button.html" with type="button" label="Cancel" variant="ghost" attrs="data-modal-close" only %}
      {% include "components/ui/button.html" with type="button" label="Confirm" variant="danger" attrs="data-confirm-go" only %}
    </div>
  </div>
</div>
