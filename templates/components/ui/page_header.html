<div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
  <div>
    <h1 class="text-2xl font-semibold tracking-normal sm:text-3xl">{{ title }}</h1>
    {% if subtitle %}<p class="mt-2 max-w-2xl text-sm leading-6 text-slate-600 dark:text-slate-400">{{ subtitle }}</p>{% endif %}
  </div>
  {% if action_label %}<a href="{{ action_url|default:'#' }}" class="inline-flex min-h-11 items-center justify-center rounded-lg bg-[var(--primary-color)] px-4 text-sm font-semibold text-white">{{ action_label }}</a>{% endif %}
</div>
