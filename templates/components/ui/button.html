{% spaceless %}
{% if href %}
<a href="{{ href }}"
   class="btn btn-{{ variant|default:'secondary' }}{% if size %} btn-{{ size }}{% endif %}{% if only_icon %} btn--icon{% endif %}{% if extra %} {{ extra }}{% endif %}"
   {% if title %}title="{{ title }}" aria-label="{{ title }}"{% endif %}
   {% if target %}target="{{ target }}"{% endif %}>
  {% if icon %}<span aria-hidden="true">{{ icon }}</span>{% endif %}{% if label %}<span>{{ label }}</span>{% endif %}
</a>
{% else %}
<button type="{{ type|default:'submit' }}"
        class="btn btn-{{ variant|default:'secondary' }}{% if size %} btn-{{ size }}{% endif %}{% if only_icon %} btn--icon{% endif %}{% if extra %} {{ extra }}{% endif %}"
        {% if name %}name="{{ name }}"{% endif %}{% if value %} value="{{ value }}"{% endif %}
        {% if title %}title="{{ title }}" aria-label="{{ title }}"{% endif %}
        {% if onclick %}onclick="{{ onclick }}"{% endif %}
        {% if disabled %}disabled{% endif %}>
  {% if icon %}<span aria-hidden="true">{{ icon }}</span>{% endif %}{% if label %}<span>{{ label }}</span>{% endif %}
</button>
{% endif %}
{% endspaceless %}
