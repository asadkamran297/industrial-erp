{% spaceless %}
<button type="button"
        class="inline-grid h-9 w-9 flex-none place-items-center rounded-lg border border-[var(--primary-color)] bg-white text-sm font-semibold text-[var(--primary-color)] shadow-sm transition hover:bg-[var(--primary-color)] hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-[var(--primary-color)] dark:bg-slate-900 dark:hover:text-white"
        onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.href = '{{ back_url|default:"/" }}'; }"
        title="Go back" aria-label="Go back">
  <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M19 12H5"></path>
    <path d="m12 19-7-7 7-7"></path>
  </svg>
</button>
{% endspaceless %}
