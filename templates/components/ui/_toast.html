<div x-data="{ show: false }" x-init="$nextTick(() => show = true); setTimeout(() => show = false, 5000)" x-show="show" x-cloak x-transition.opacity
     class="alert flex items-start gap-2 shadow-lg{% if message.tags == 'error' %} alert--danger{% elif message.tags == 'success' %} alert--success{% elif message.tags == 'warning' %} alert--warning{% endif %}" role="status">
  <span class="mt-px">{% if message.tags == 'success' %}{% icon "check" %}{% elif message.tags == 'error' or message.tags == 'warning' %}{% icon "alert" %}{% else %}{% icon "info" %}{% endif %}</span>
  <span class="flex-1 font-medium">{{ message }}</span>
  <button type="button" class="icon-btn" title="Dismiss" aria-label="Dismiss" @click="show = false">{% icon "close" %}</button>
</div>
