<div class="mb-4 rounded-xl border border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900" x-data="{ open: {{ has_table_filters|yesno:'true,false' }} }">
  <button type="button" class="flex min-h-12 w-full items-center justify-between gap-3 px-4 text-left" @click="open = !open" :aria-expanded="open.toString()">
    <div>
      <p class="text-sm font-semibold text-slate-900 dark:text-white">Search & filters</p>
      {% if has_table_filters %}<p class="text-xs text-slate-500 dark:text-slate-400">Filtered results are active</p>{% endif %}
    </div>
    <span class="text-sm text-slate-500 transition" :class="{ 'rotate-90': open }">&gt;</span>
  </button>
  <form method="get" x-show="open" x-transition class="border-t border-slate-200 p-4 dark:border-slate-800">
    <div class="grid gap-3 md:grid-cols-[1fr_auto]">
      <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
        <div>
          <label class="sr-only" for="table-search">Search</label>
          <input id="table-search" class="search-input" type="search" name="q" value="{{ search_query }}" placeholder="{{ search_placeholder|default:'Search records...' }}">
        </div>
        {% for filter in filter_specs %}
          <div>
            <label class="sr-only" for="filter-{{ filter.name }}">{{ filter.label }}</label>
            <select id="filter-{{ filter.name }}" name="{{ filter.name }}" class="form-select">
              <option value="">{{ filter.label }}</option>
              {% for value, label in filter.choices %}
                <option value="{{ value }}" {% if filter.value == value|stringformat:'s' %}selected{% endif %}>{{ label }}</option>
              {% endfor %}
            </select>
          </div>
        {% endfor %}
        {% for d in date_filter_specs %}
          <div>
            <label class="mb-1 block text-xs font-medium text-slate-500 dark:text-slate-400" for="filter-{{ d.from_param }}">{{ d.label }} from</label>
            <input id="filter-{{ d.from_param }}" type="date" name="{{ d.from_param }}" value="{{ d.from_value }}" class="form-input">
          </div>
          <div>
            <label class="mb-1 block text-xs font-medium text-slate-500 dark:text-slate-400" for="filter-{{ d.to_param }}">{{ d.label }} to</label>
            <input id="filter-{{ d.to_param }}" type="date" name="{{ d.to_param }}" value="{{ d.to_value }}" class="form-input">
          </div>
        {% endfor %}
      </div>
      <div class="flex items-center justify-end gap-2">
        <a href="{{ request.path }}" class="toolbar-btn">Reset</a>
        <button type="submit" class="btn-primary">Search</button>
      </div>
    </div>
  </form>
</div>
