<th{% if align == 'right' %} class="num"{% elif align == 'center' %} class="text-center"{% endif %}>
  <a class="sort-link{% if sort_key == field %} is-on{% endif %}" href="?{{ sort_base_query }}sort={{ field }}&amp;dir={% if sort_key == field and sort_dir == 'asc' %}desc{% else %}asc{% endif %}"{% if sort_key == field %} aria-sort="{% if sort_dir == 'asc' %}ascending{% else %}descending{% endif %}"{% endif %}>
    <span>{{ label }}</span>{% if sort_key == field and sort_dir == 'desc' %}{% icon "sort-down" %}{% else %}{% icon "sort-up" %}{% endif %}
  </a>
</th>
