{% if is_paginated %}
  <nav class="mt-4 flex flex-wrap items-center justify-between gap-3 text-sm text-slate-600 dark:text-slate-400" aria-label="Pagination">
    <p>Showing page {{ page_obj.number }} of {{ paginator.num_pages }} · {{ paginator.count }} records</p>
    <div class="flex items-center gap-2">
      {% if page_obj.has_previous %}
        <a class="rounded-md border border-slate-200 px-3 py-2 hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800" href="?{{ page_query_prefix }}page={{ page_obj.previous_page_number }}">Previous</a>
      {% endif %}
      <span class="rounded-md bg-slate-100 px-3 py-2 font-medium text-slate-900 dark:bg-slate-800 dark:text-white">{{ page_obj.number }}</span>
      {% if page_obj.has_next %}
        <a class="rounded-md border border-slate-200 px-3 py-2 hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800" href="?{{ page_query_prefix }}page={{ page_obj.next_page_number }}">Next</a>
      {% endif %}
    </div>
  </nav>
{% endif %}
