{% with state=label|default:"Status"|lower %}
<span class="badge {% if state == 'active' or state == 'posted' or state == 'approved' or state == 'paid' or state == 'completed' %}badge-success{% elif state == 'draft' or state == 'pending' or state == 'partial' %}badge-warning{% elif state == 'inactive' or state == 'cancelled' or state == 'rejected' or state == 'void' %}badge-danger{% else %}badge-muted{% endif %}">{{ label|default:"Status" }}</span>
{% endwith %}
