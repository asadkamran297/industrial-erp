{% spaceless %}
{% if label %}<div class="field{% if wrap %} {{ wrap }}{% endif %}"><label class="field__label" for="{% if id %}{{ id }}{% else %}{{ name }}{% endif %}">{{ label }}{% if required %} <span class="req">*</span>{% endif %}</label>{% endif %}
{% if type == "select" %}
<select{% if name %} name="{{ name }}"{% endif %}{% if id or label %} id="{% if id %}{{ id }}{% else %}{{ name }}{% endif %}"{% endif %} class="{% if cell %}li-cell{% else %}control{% if size %} control--{{ size }}{% endif %}{% endif %}{% if extra %} {{ extra }}{% endif %}"{% if required %} required{% endif %}{% if disabled %} disabled{% endif %}{% if form_id %} form="{{ form_id }}"{% endif %}{% if searchable %} data-searchable{% endif %}{% if attrs %} {{ attrs|safe }}{% endif %}>{{ slot }}</select>
{% elif type == "textarea" %}
<textarea{% if name %} name="{{ name }}"{% endif %}{% if id or label %} id="{% if id %}{{ id }}{% else %}{{ name }}{% endif %}"{% endif %} rows="{{ rows|default:2 }}" class="control{% if grow %} control--grow{% endif %}{% if extra %} {{ extra }}{% endif %}"{% if required %} required{% endif %}{% if readonly %} readonly{% endif %}{% if placeholder %} placeholder="{{ placeholder }}"{% endif %}{% if form_id %} form="{{ form_id }}"{% endif %}{% if attrs %} {{ attrs|safe }}{% endif %}>{{ value|default_if_none:"" }}</textarea>
{% else %}
<input type="{% if kind == 'money' %}text{% else %}{{ type|default:'text' }}{% endif %}"{% if name %} name="{{ name }}"{% endif %}{% if id or label %} id="{% if id %}{{ id }}{% else %}{{ name }}{% endif %}"{% endif %}{% if value is not None and value != "" %} value="{{ value }}"{% endif %} class="{% if cell %}li-cell{% elif type == 'checkbox' or type == 'radio' %}check{% else %}control{% if size %} control--{{ size }}{% endif %}{% if type == 'date' %} control--date{% endif %}{% endif %}{% if kind == 'money' %} control--money num{% elif kind == 'weight' %} control--weight num{% elif kind == 'num' %} control--num num{% endif %}{% if extra %} {{ extra }}{% endif %}"{% if kind == 'money' %} inputmode="decimal" data-amount{% elif kind == 'weight' %} inputmode="decimal" data-no-amount{% endif %}{% if step %} step="{{ step }}"{% elif kind == 'weight' %} step="0.001"{% endif %}{% if min is not None and min != "" %} min="{{ min }}"{% endif %}{% if max %} max="{{ max }}"{% endif %}{% if maxlength %} maxlength="{{ maxlength }}"{% endif %}{% if placeholder %} placeholder="{{ placeholder }}"{% endif %}{% if required %} required{% endif %}{% if readonly %} readonly{% endif %}{% if disabled %} disabled{% endif %}{% if checked %} checked{% endif %}{% if autofocus %} autofocus{% endif %}{% if form_id %} form="{{ form_id }}"{% endif %}{% if accept %} accept="{{ accept }}"{% endif %}{% if attrs %} {{ attrs|safe }}{% endif %}>
{% endif %}
{% if label %}</div>{% endif %}
{% endspaceless %}
