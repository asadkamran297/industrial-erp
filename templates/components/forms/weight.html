{% if field %}{% include "components/forms/field.html" with kind="weight" %}{% else %}
<div class="field{% if extra %} {{ extra }}{% endif %}">
  {% if label %}<label class="field__label" for="{% if id %}{{ id }}{% else %}{{ name }}{% endif %}">{{ label }}{% if required %} <span class="req">*</span>{% endif %}</label>{% endif %}
  <input type="number" step="0.001" min="0" inputmode="decimal" data-no-amount name="{{ name }}" id="{% if id %}{{ id }}{% else %}{{ name }}{% endif %}" value="{{ value|default_if_none:'' }}" placeholder="0.000" class="control control--weight"{% if required %} required{% endif %}{% if readonly %} readonly{% endif %}{% if form_id %} form="{{ form_id }}"{% endif %}>
</div>
{% endif %}
