<nav class="mt-6 space-y-6" aria-label="Main menu">
  {% regroup portal_navigation by section as nav_sections %}
  {% for section in nav_sections %}
    <div>
      {% if section.grouper != "main" %}
        <p class="mb-2 px-3 text-[11px] font-semibold uppercase tracking-wide text-slate-400 dark:text-slate-500">{{ section.grouper }}</p>
      {% endif %}
      <div class="space-y-1">
        {% for item in section.list %}
          <a href="{{ item.href }}" class="flex min-h-11 items-center gap-3 rounded-lg px-3 text-sm font-medium transition {% if item.is_active %}bg-[var(--primary-color)] text-white shadow-sm{% else %}text-slate-700 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800{% endif %}">
            <span class="grid h-7 w-7 shrink-0 place-items-center rounded-md {% if item.is_active %}bg-white/15 text-white{% else %}bg-slate-100 text-slate-500 dark:bg-slate-800 dark:text-slate-300{% endif %}">{{ item.icon }}</span>
            <span class="truncate">{{ item.label }}</span>
          </a>
        {% endfor %}
      </div>
    </div>
  {% empty %}
    <div class="rounded-lg border border-dashed border-slate-200 p-4 text-sm text-slate-500 dark:border-slate-700 dark:text-slate-400">
      No menu items available.
    </div>
  {% endfor %}
</nav>
