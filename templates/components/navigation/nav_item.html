{% if item.has_children %}
  <div x-data="{ open: {{ item.is_open|yesno:'true,false' }} }">
    <button type="button" class="{{ item.item_class }}" @click="open = !open" :aria-expanded="open.toString()">
      {% if item.depth == 0 %}<span class="{{ item.icon_class }}">{{ item.icon }}</span>{% endif %}
      <span class="min-w-0 flex-1 truncate" x-show="!sidebarCollapsed || item.depth > 0" x-transition.opacity>{{ item.label }}</span>
      <span class="grid transition" x-show="!sidebarCollapsed || item.depth > 0" :class="{ 'rotate-90': open }">{% icon "chevron-right" size="sm" %}</span>
    </button>
    <div x-show="open && (!sidebarCollapsed || item.depth > 0)" x-transition class="mt-0.5 space-y-0.5 border-l border-slate-200 pl-4 dark:border-slate-800">
      {% for child in item.children %}
        {% include "components/navigation/nav_item.html" with item=child %}
      {% endfor %}
    </div>
  </div>
{% else %}
  <div class="nav-leaf{% if item.is_favourite %} is-fav{% endif %}" data-nav-leaf data-href="{{ item.href }}" data-label="{{ item.label }}">
    <a href="{{ item.href }}" class="{{ item.item_class }}"{% if item.is_current %} aria-current="page"{% endif %}>
      {% if item.depth == 0 %}<span class="{{ item.icon_class }}">{{ item.icon }}</span>{% endif %}
      <span class="truncate" x-show="!sidebarCollapsed || item.depth > 0" x-transition.opacity>{{ item.label }}</span>
    </a>
    <button type="button" class="nav-fav" data-fav-toggle title="Favourite" aria-label="Favourite" x-show="!sidebarCollapsed || item.depth > 0">{% icon "star" size="sm" %}</button>
  </div>
{% endif %}
