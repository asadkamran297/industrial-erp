{% extends "layouts/portal.html" %}
{% block content %}
{% component "report/shell" title=title table_id=table_id no_pagination=False %}
  {% slot filters %}
    <label class="filter-chip">{{ extra.threshold_label|default:"Threshold" }} {% include "components/forms/control.html" with type="number" name="threshold" value=extra.threshold cell=True step="0.01" min="0" attrs='onchange="this.form.submit()" aria-label="Threshold"' only %}</label>
  {% endslot %}
  {% include "components/report/table.html" %}
{% endcomponent %}
{% endblock %}
