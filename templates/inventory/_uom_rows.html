{% for row in records %}
  <div class="uom-row{% if selected_uom and selected_uom.pk == row.pk %} is-selected{% endif %}">
    <a class="uom-row-link" data-unit="{{ row.pk }}" data-title="{{ row.title }}" data-code="{{ row.code }}"
       href="?selected_uom={{ row.pk }}{% if search_query %}&q={{ search_query }}{% endif %}">
      <span class="uom-row-title">{{ row.title }}</span>
      <span class="uom-row-code">{{ row.code }}</span>
    </a>
    {% if can_edit %}
    <button type="button" title="Edit unit"
            data-unit-edit="{{ row.pk }}" data-title="{{ row.title }}" data-code="{{ row.code }}" data-status="{{ row.status }}"
            class="grid h-7 w-7 shrink-0 place-items-center rounded-md text-slate-400 hover:bg-slate-100 hover:text-[var(--primary-color)] dark:hover:bg-slate-800">&#9998;</button>
    {% endif %}
    {% if can_delete %}
    <button type="button" title="Delete unit"
            data-unit-delete="{{ row.pk }}" data-title="{{ row.title }}"
            class="mr-2 grid h-7 w-7 shrink-0 place-items-center rounded-md text-slate-400 hover:bg-rose-50 hover:text-rose-600 dark:hover:bg-slate-800">&#128465;</button>
    {% endif %}
  </div>
{% empty %}
  <p class="uom-empty">No units found.</p>
{% endfor %}
