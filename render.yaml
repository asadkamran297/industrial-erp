databases:
  - name: industrial-erp-db
    databaseName: industrial_erp
    plan: free

services:
  - type: web
    name: industrial-erp
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi --log-file -"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: industrial-erp-db
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        value: "admin"
      - key: DJANGO_SUPERUSER_PASSWORD
        value: "Admin@12345"
      - key: DJANGO_SUPERUSER_EMAIL
        value: "gedana5173@ezimb.com"
