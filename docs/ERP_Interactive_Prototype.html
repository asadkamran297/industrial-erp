  g.stdYield = g.stdYield || DB.settings.wheat.standardYield; return g;
}
function saveGrinding(g) {

  if (!g.godown) fail('Godown is required'); if (!g.wheat) fail('Wheat item is required'); if (num(g.wheatKg) <= 0) fail('Enter the wheat consumed');
  if (!g.outputs.length) fail('Add at least one output'); if (g.to && g.from && g.to < g.from) fail('The run cannot end before it started');
  if (num(g.bagQty) && !g.bagItem) fail('Choose the sack the bags were released from');
  if (g.id) dropLedgers('WG', g.id);
  try {
    needStockProduct(g.wheat, g.godown, num(g.wheatKg));
    if (g.bagItem && num(g.bagQty)) needStockProduct(g.bagItem, g.godown, num(g.bagQty));
    const packNeed = {}; g.outputs.forEach(o => { if (o.pack && num(o.packQty)) packNeed[o.pack] = (packNeed[o.pack] || 0) + num(o.packQty); });
    Object.entries(packNeed).forEach(([p, q]) => needStockProduct(p, g.godown, q));
  } catch (e) { if (g.id) postGrindingStock(get('grindings', g.id)); throw e; }
  if (!g.id) { g.no = nextNo('WG'); insert('grindings', g); } else Object.assign(get('grindings', g.id), g);
  postGrindingStock(get('grindings', g.id)); audit('Saved', g.no); return g;

function postGrindingStock(g) {
  const base = { date: g.date, godown: g.godown, ref: g.no, refType: 'WG', refId: g.id };
  pmove({ ...base, product: g.wheat, qty: -num(g.wheatKg), source: 'production_out' });
  if (g.bagItem && num(g.bagQty)) pmove({ ...base, product: g.bagItem, qty: -num(g.bagQty), source: 'production_out' });
  g.outputs.forEach(o => { pmove({ ...base, product: o.product, qty: num(o.qty), source: 'production_in' }); if (o.pack && num(o.packQty)) pmove({ ...base, product: o.pack, qty: -num(o.packQty), source: 'packing_out' }); });
}

  c.sourceKg = r3(num(c.sourceQty) * c.sourceUnitWeight); c.totalKg = r3(c.outputs.reduce((s, o) => s + o.kg, 0));

  else { if (!a.godown) fail('Godown is required'); if (q < 0) needStockProduct(a.ref, a.godown, -q); pmove({ date: a.date, product: a.ref, godown: a.godown, qty: q, rate, source: 'adjustment', ref: a.no, refType: 'ADJ', refId: a.id }); }

function syncPartyOpening(kind, row) {

/* --- Payroll --- */
function payrollFigures(emp) {
  const items = DB.salaryItems.filter(s => s.employee == emp.id && s.status !== 'inactive');
  const allow = r2(items.filter(i => i.type === 'allowance').reduce((s, i) => s + num(i.amount), 0)), ded = r2(items.filter(i => i.type === 'deduction').reduce((s, i) => s + num(i.amount), 0));
  return { base: r2(num(emp.baseSalary)), allow, ded, net: r2(num(emp.baseSalary) + allow - ded) };
}
function generatePayroll(month, year) {
  let n = 0;
  DB.employees.filter(e => e.status === 'active').forEach(e => { if (DB.payrolls.some(p => p.employee == e.id && p.month == month && p.year == year)) return; const f = payrollFigures(e); insert('payrolls', { employee: e.id, month: +month, year: +year, ...f, status: 'pending' }); n++; });
  return n;
}
function approvePayroll(p) {

/* --- Cost of sales (periodic) --- */
function stockValueAt(date, bucket) {
  let v = 0; DB.products.filter(isStocked).forEach(p => { if (bucket && SPEC_BUCKET[p.spec] !== bucket) return; const q = prodStock(p.id, null, date); if (q > 0) v += q * closingRate(p.id, date); }); return r2(v);
}
function costOfSales(from, to) {
  const res = { buckets: {} }; const prev = addDays(from, -1);
  ['wheat', 'packing', 'finished'].forEach(b => {
    const open = stockValueAt(prev, b), close = stockValueAt(to, b);
    let purch = 0; DB.prodLedger.forEach(e => { const p = get('products', e.product); if (SPEC_BUCKET[p.spec] !== b || e.date < from || e.date > to) return; if (['purchase', 'purchase_return'].includes(e.source) || (e.source === 'reversal' && e.refType === 'PI')) purch += e.qty * e.rate; if (e.source === 'opening') purch += e.qty * e.rate; });
    res.buckets[b] = { open, purch: r2(purch), close, cost: r2(open + purch - close) };
  });
  const bal = allBalances(from, to);
  res.direct = r2(DB.accounts.filter(a => a.type === 'EXPENSES' && a.group === 'Direct Expenses' && a.code !== A.cogs).reduce((s, a) => s + ((bal[a.id]?.dr || 0) - (bal[a.id]?.cr || 0)), 0));
  res.open = r2(Object.values(res.buckets).reduce((s, b) => s + b.open, 0)); res.purch = r2(Object.values(res.buckets).reduce((s, b) => s + b.purch, 0)); res.close = r2(Object.values(res.buckets).reduce((s, b) => s + b.close, 0));
  res.stockCost = r2(res.open + res.purch - res.close); res.cost = r2(res.stockCost + res.direct);
  const sales = DB.accounts.find(a => a.code === A.sales), ret = accByCode(A.salesRet), disc = accByCode(A.salesDisc);
  res.sales = r2((bal[sales.id]?.cr || 0) - (bal[sales.id]?.dr || 0)); res.returns = r2((bal[ret.id]?.dr || 0) - (bal[ret.id]?.cr || 0)) + r2((bal[disc.id]?.dr || 0) - (bal[disc.id]?.cr || 0));
  res.gross = r2(res.sales - res.returns - res.cost); return res;
}
function postCostOfSales(from, to) {
  const key = from + ':' + to; const existing = DB.vouchers.find(v => v.source === 'COS' && v.sourceId === key && !v.reversed && !v.reversalOf);
  const overlap = DB.vouchers.find(v => v.source === 'COS' && !v.reversed && !v.reversalOf && v.sourceId !== key && !(v.sourceId.split(':')[1] < from || v.sourceId.split(':')[0] > to));

  if (cs.stockCost < 0) { L[0] = { acc: AID(A.cogs), dr: 0, cr: -cs.stockCost, narr: 'Cost of sales' }; }

}

function lineChart(series, labels) {

  const lines = series.map(s => `<polyline fill="none" stroke="${s.color}" stroke-width="2" points="${s.vals.map((v, i) => x(i) + ',' + y(v)).join(' ')}"/>${s.vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${s.color}"><title>${s.name} ${labels[i]}: Rs ${money(v)}</title></circle>`).join('')}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;color:inherit">${grid}${lines}${labels.map((l, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity=".55">${l}</text>`).join('')}</svg>`;
}
